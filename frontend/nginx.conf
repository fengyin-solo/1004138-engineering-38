server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带 hash，可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # history 路由：刷新 /load_equip/1 等路径时回退入口页，不再 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
