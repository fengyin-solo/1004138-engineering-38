server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 单页应用：刷新深层路由时回退到 index.html，避免 404（也避免刷新又落回旧入口）。
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带哈希的静态资源可长缓存。
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
